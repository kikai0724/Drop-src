<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drop</title>
  <style>
    :root {
      --frame-w: 854px;
      --frame-h: 480px;
      --fg: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.72);
      --line: rgba(255,255,255,0.16);
      --shadow: rgba(102, 71, 255, 0.45);
      font-family: "Segoe UI", "Bricolage Grotesque", "Meiryo", "Noto Sans JP", Arial, sans-serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html,
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 70% 18%, #221a64 0%, #10152d 46%, #050612 100%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
    }

    .splash-shell {
      position: relative;
      width: var(--frame-w);
      height: var(--frame-h);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        radial-gradient(circle at 56% 42%, rgba(118,67,228,0.65), transparent 28%),
        radial-gradient(circle at 72% 54%, rgba(41,172,230,0.22), transparent 25%),
        linear-gradient(135deg, #07142f 0%, #181a54 50%, #21102d 100%);
      box-shadow: 0 0 44px rgba(114, 84, 255, 0.45), inset 0 0 80px rgba(92, 223, 255, 0.08);
      filter: saturate(110%);
    }

    .splash-shell::before {
      content: "";
      position: absolute;
      inset: -1px;
      background-image: radial-gradient(#7a89ff 1px, transparent 1px);
      background-size: 44px 44px;
      background-position: 50% 50%;
      opacity: 0.28;
      mask-image: linear-gradient(180deg, rgba(0,0,0,1), transparent 100%);
      transform: rotate(2deg);
      animation: driftStars 12s linear infinite;
      pointer-events: none;
    }

    .splash-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.55) 0 1px, transparent 1px);
      background-size: 38px 38px;
      background-position: center;
      opacity: 0.35;
      animation: driftStars 9s ease-in-out infinite;
      pointer-events: none;
    }

    .noise {
      position: absolute;
      inset: -30%;
      background-image: repeating-linear-gradient(115deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 3px);
      transform: rotate(-4deg);
      opacity: 0.45;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 56%, rgba(1,4,18,0.68) 100%);
      pointer-events: none;
    }

    .game-logo {
      position: absolute;
      left: 24px;
      bottom: 22px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background-image: url('https://i.imgur.com/74CnPwD.png');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 0 14px rgba(255,255,255,0.12), inset 0 0 14px rgba(255,255,255,0.08);
      z-index: 3;
      opacity: 0.92;
    }

    .center-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      z-index: 2;
    }

    .splash-card {
      position: relative;
      width: min(420px, calc(100% - 80px));
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid rgba(218, 218, 255, 0.12);
      background: rgba(61, 74, 138, 0.16);
      box-shadow: inset 0 0 16px rgba(255,255,255,0.04), 0 0 30px rgba(100,60,255,0.16);
      backdrop-filter: blur(2px);
      animation: cardFade 900ms ease-out both;
    }

    .splash-card::before,
    .splash-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: -10px;
      border: 1px solid rgba(205, 213, 255, 0.12);
      filter: blur(0.5px);
    }

    .splash-card::after {
      inset: -14px;
      border-color: rgba(84, 207, 255, 0.10);
    }

    .splash-image {
      width: min(270px, 58vw);
      max-height: 220px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 24px rgba(151,104,255,0.30), 0 0 60px rgba(116,81,255,0.20);
      opacity: 0;
      transform: scale(0.96);
      animation: splashEnter 900ms cubic-bezier(.2,.75,.16,1) forwards, pulseGlow 1.9s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(180, 128, 255, 0.8)) drop-shadow(0 0 30px rgba(90, 150, 255, 0.42));
    }

    .stats-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 340ms ease, transform 340ms ease;
      background: rgba(12, 14, 28, 0.84);
      z-index: 2;
    }

    .stats-iframe.visible {
      opacity: 1;
      transform: scale(1);
    }

    .scanline {
      position: absolute;
      inset: -25%;
      background: linear-gradient(90deg, transparent, rgba(180, 211, 255, 0.10), transparent);
      transform: skewX(-12deg);
      opacity: 0.66;
      animation: scan 1800ms ease-in-out infinite;
      pointer-events: none;
    }

    .status-text {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 3;
      color: var(--fg);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.30em;
      white-space: nowrap;
      border-radius: 4px;
      background: rgba(5, 12, 40, 0.32);
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 16px rgba(99, 79, 255, 0.22);
      font-family: "Segoe UI", Arial, sans-serif;
      animation: textBlink 1.4s steps(2) infinite;
    }

    .status-text .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b8eaff;
      vertical-align: middle;
      margin-right: 10px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .status-text .dots::after {
      content: "";
      display: inline-block;
      width: 18px;
      animation: dots 1.4s steps(4) infinite;
      vertical-align: middle;
      margin-left: 4px;
    }

    @keyframes splashEnter {
      from {
        opacity: 0;
        transform: scale(0.93);
      }
      to {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes cardFade {
      from {
        opacity: 0.1;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseGlow {
      50% {
        filter: drop-shadow(0 0 16px rgba(180, 128, 255, 0.88)) drop-shadow(0 0 34px rgba(116, 150, 255, 0.58));
      }
    }

    @keyframes scan {
      50% {
        transform: translateY(15px) skewX(-12deg);
        opacity: 0.80;
      }
    }

    @keyframes dots {
      50% {
        content: "...";
      }
    }

    @keyframes dotPulse {
      50% { transform: scale(1.3); opacity: 0.8; }
    }

    @keyframes driftStars {
      50% { transform: translateY(8px); }
    }

    @keyframes textBlink {
      50% { filter: brightness(1.15); }
    }
  </style>
</head>
<body>
  <div class="splash-shell">
    <div class="noise"></div>
    <div class="vignette"></div>

    <div class="center-wrap">
      <div class="splash-card">
        <div class="scanline"></div>
        <img class="splash-image" id="splash-image" alt="" />
        <iframe class="stats-iframe" id="stats-iframe" title="Stats"></iframe>
      </div>
    </div>

    <div class="game-logo"></div>

    <div class="status-text">
      <span class="dot"></span>
      <span id="statusText" class="dots">ゲームを起動中..</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const image = params.get('image') || 'https://pub-b3ee689799f143a7968146e63124b471.r2.dev/dropspl.png';
    const title = params.get('title') || 'Drop';
    const lang = (params.get('lang') || navigator.language || 'en').toLowerCase();
    const imageEl = document.getElementById('splash-image');
    const statsFrame = document.getElementById('stats-iframe');
    const statusText = document.getElementById('statusText');
    const statsUrl = params.get('statsUrl') || '';
    const shouldShowStats = params.get('stats') === '1' || params.get('stats') === 'true';

    if (imageEl) {
      imageEl.src = image;
      imageEl.style.display = shouldShowStats ? 'none' : 'block';
    }

    if (statsFrame && shouldShowStats && statsUrl) {
      statsFrame.src = statsUrl;
      statsFrame.classList.add('visible');
    }

    const requestedStatus = params.get('status');
    if (requestedStatus) {
      statusText.textContent = requestedStatus;
    } else {
      const supported = {
        'ja': 'ゲームを起動中..',
        'en': 'Launching game..',
        'ko': '게임 시작 중..',
        'zh': '正在启动游戏..'
      };

      let selected = 'en';
      if (lang.startsWith('ja')) selected = 'ja';
      else if (lang.startsWith('ko')) selected = 'ko';
      else if (lang.startsWith('zh')) selected = 'zh';

      if (supported[selected]) {
        statusText.textContent = supported[selected];
      } else {
        statusText.textContent = supported['en'];
      }
    }

    document.title = title;

    function normalizeDots(active) {
      const base = active || statusText.textContent || 'Launching game..';
      const slash = base.endsWith('..') ? base : base + '..';
      return slash.replace(/\.+$/, '..');
    }

    const loader = () => {
      const phase = statusText.textContent;
      const animated = normalizeDots(phase);
      statusText.innerHTML = `<span class="dot"></span><span class="dots">${animated}</span>`;
      statusText.setAttribute('aria-label', animated);
    };

    setInterval(loader, 900);
  </script>
</body>
</html>
